name: Feed Analysis Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Дозволяє запускати вручну з вкладки Actions

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажуємо ваш код з GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Налаштовуємо Node.js версії 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Встановлюємо необхідні бібліотеки прямо під час виконання
      - name: Install required NPM packages
        run: npm install @google/generative-ai @supabase/supabase-js

      # 4. Запускаємо ваш аналіз з секретними ключами
      - name: Run Gemini Analysis
        run: node analyze-gemini.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
