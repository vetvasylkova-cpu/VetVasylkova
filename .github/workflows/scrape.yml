name: Run Pethouse Scraper

on:
  workflow_dispatch:   # Запуск кнопкою вручну
  # schedule:
  #   - cron: '0 8 * * *' # Розклад (можна розкоментувати, коли знадобиться)

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape-pethouse.js
