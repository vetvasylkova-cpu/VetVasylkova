name: Run Pethouse Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # Буде запускатися щодня о 08:00

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install  # <-- ОСЬ ЦЕЙ РЯДОК МАЄ БУТИ ОБОВ'ЯЗКОВО

    - name: Run analyzer
      run: node analyze-gemini.js
          
      - name: Install dependencies
        run: npm install
        
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape-pethouse.js
