name: VetOS Database Auto Sync

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    paths:
      - '**.xlsx'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Feeds & Ingredients to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas openpyxl requests

      - name: Run Auto Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: python scripts/auto_sync_feeds.py
